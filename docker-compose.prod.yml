services:
  postgres:
    image: postgres:16-alpine
    container_name: dental_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-webarcodental}
      TZ: America/Tegucigalpa
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
    container_name: dental_backend_prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3030}:3030"
    environment:
      NODE_ENV: production
      PORT: 3030
      BACKEND_URL: ${BACKEND_URL:?Definir BACKEND_URL}
      ENABLE_OUTBOUND_MESSAGES: ${ENABLE_OUTBOUND_MESSAGES:-false}
      ENABLE_NOTIFICATION_JOBS: ${ENABLE_NOTIFICATION_JOBS:-false}
      ENABLE_TWILIO_WEBHOOK: ${ENABLE_TWILIO_WEBHOOK:-false}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webarcodental}
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Definir JWT_REFRESH_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80}
      TZ: America/Tegucigalpa
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
    container_name: dental_frontend_prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
