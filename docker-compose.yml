services:
  postgres:
    image: postgres:16
    container_name: dental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webarcodental}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: dental_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3030}:3030"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    environment:
      PORT: ${BACKEND_PORT:-3030}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-webarcodental}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo '⚙️  Generando cliente Prisma...' &&
        npx prisma generate &&
        echo '🔧 Aplicando migraciones...' &&
        npx prisma migrate deploy &&
        echo '🌱 Plantando semillas...' &&
        npx prisma db seed &&
        echo '✅ ¡Entorno listo! 🚀 Iniciando servidor...' &&
        npm run start:dev
      "

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: dental_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3030}
    depends_on:
      - backend

volumes:
  postgres_data:
